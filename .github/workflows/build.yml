name: Build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ x64-debug, x64-release ]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    steps:
      - uses: actions/checkout@v4

      # vcpkg at the same commit as builtin-baseline in vcpkg.json
      - name: Read vcpkg baseline
        id: baseline
        shell: pwsh
        run: echo "commit=$((Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline')" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.commit }}
          path: .vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          .vcpkg/bootstrap-vcpkg.bat -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Generation must stay bit-identical - compare benchmark checksums with the reference values
      - name: Benchmark checksums
        if: matrix.preset == 'x64-release'
        shell: pwsh
        working-directory: ProceduralTerrainGenerator
        run: |
          $output = & ../out/build/x64-release/ProceduralTerrainGenerator.exe --benchmark | Out-String
          Write-Output $output
          $expected = @(
            '8a8df8aff8457944   01e2d197faaa91ee   2226c9def0b85b81',
            '9ecec06113f1ff1d   d602f1e24734666d   94a3305aac6164b0',
            'b3bd8438fa050fa7   3da44213bcab5679   ad3b6ca276875106'
          )
          foreach ($line in $expected) {
            if (-not $output.Contains($line)) { Write-Error "Checksums changed, expected: $line"; exit 1 }
          }
