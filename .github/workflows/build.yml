name: Build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  windows:
    # VS 2022, as used locally - windows-latest and windows-2025 use VS 2026
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [ x64-debug, x64-release ]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      # Mesa for Windows (github.com/pal1000/mesa-dist-win) for the generation check; a new version needs its archive hash
      MESA_VERSION: "26.3.1"
      MESA_SHA256: "64E84CF13D67DD354640BF443ED0445E6A83AFD06A5729F0750B3744D633B3F1"

    steps:
      - uses: actions/checkout@v4

      # vcpkg at the same commit as builtin-baseline in vcpkg.json
      - name: Read vcpkg baseline
        id: baseline
        shell: pwsh
        run: echo "commit=$((Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline')" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.commit }}
          path: .vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          .vcpkg/bootstrap-vcpkg.bat -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }}

      # Generation runs only in compute shaders and the runners have no GPU: --gpu-check runs on Mesa llvmpipe (OpenGL 4.5 on the CPU),
      # its opengl32.dll next to a copy of the exe (the build folder stays on the system OpenGL). Release only: Debug would take far longer
      - name: Cache Mesa
        if: matrix.preset == 'x64-release'
        id: mesa-cache
        uses: actions/cache@v4
        with:
          path: .mesa
          key: mesa-${{ env.MESA_VERSION }}

      - name: Download Mesa
        if: matrix.preset == 'x64-release' && steps.mesa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .mesa | Out-Null
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z" -OutFile mesa.7z -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash mesa.7z -Algorithm SHA256).Hash -ne $env:MESA_SHA256) { throw "Unexpected Mesa archive" }
          # 7-Zip is on the runner image; otherwise the tar of Windows (libarchive reads 7z, the tar of Git earlier in PATH does not)
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          if (Test-Path $sevenZip) {
            # Quoted: PowerShell splits an unquoted -o.mesa into "-o" ".mesa"
            & $sevenZip x mesa.7z "-o.mesa" x64\opengl32.dll x64\libgallium_wgl.dll -y
          }
          else {
            & "$env:SystemRoot\System32\tar.exe" -xf mesa.7z -C .mesa x64/opengl32.dll x64/libgallium_wgl.dll
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path .mesa/x64/opengl32.dll) -or -not (Test-Path .mesa/x64/libgallium_wgl.dll)) { throw "Mesa DLLs not extracted" }

      - name: Generation check (llvmpipe)
        if: matrix.preset == 'x64-release'
        # About 1 minute on 16 cores; a hang of the software driver must not hold the runner for hours
        timeout-minutes: 20
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          New-Item -ItemType Directory -Force gpu-check | Out-Null
          Copy-Item out/build/x64-release/ProceduralTerrainGenerator.exe, .mesa/x64/opengl32.dll, .mesa/x64/libgallium_wgl.dll gpu-check/
          ./gpu-check/ProceduralTerrainGenerator.exe --gpu-check --no-timings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux-core-tests:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libtbb-dev zip unzip tar curl jq

      - name: Read vcpkg baseline
        id: baseline
        run: echo "commit=$(jq -r '."builtin-baseline"' vcpkg.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.commit }}
          path: .vcpkg

      - name: Bootstrap vcpkg
        run: |
          ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-

      - name: Configure
        run: cmake --preset linux-debug-asan

      - name: Build
        run: cmake --build --preset linux-debug-asan

      - name: Unit tests (ASan + UBSan)
        run: ctest --preset linux-debug-asan --output-on-failure

      - name: Check Python tools
        run: |
          python3 -m py_compile tools/*.py
          python3 -m unittest discover -s tools -p "test_*.py" -v
