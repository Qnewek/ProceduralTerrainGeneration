name: Build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  windows:
    # VS 2022, as used locally - windows-latest and windows-2025 use VS 2026
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [ x64-debug, x64-release ]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    steps:
      - uses: actions/checkout@v4

      # vcpkg at the same commit as builtin-baseline in vcpkg.json
      - name: Read vcpkg baseline
        id: baseline
        shell: pwsh
        run: echo "commit=$((Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline')" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.commit }}
          path: .vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          .vcpkg/bootstrap-vcpkg.bat -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Generation runs only on the GPU, which the runners do not have; it is checked by hand with --gpu-check
      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }}
