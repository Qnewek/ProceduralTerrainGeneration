name: Build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  windows:
    # Same compiler as the reference checksums (VS 2022) - windows-latest and windows-2025 use VS 2026
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [ x64-debug, x64-release ]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    steps:
      - uses: actions/checkout@v4

      # vcpkg at the same commit as builtin-baseline in vcpkg.json
      - name: Read vcpkg baseline
        id: baseline
        shell: pwsh
        run: echo "commit=$((Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline')" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.commit }}
          path: .vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          .vcpkg/bootstrap-vcpkg.bat -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }}

      # Generation must stay bit-identical - compare benchmark checksums with the reference values
      - name: Benchmark checksums
        if: matrix.preset == 'x64-release'
        shell: pwsh
        working-directory: ProceduralTerrainGenerator
        run: |
          $output = & ../out/build/x64-release/ProceduralTerrainGenerator.exe --benchmark | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 0) { Write-Error "Benchmark failed with exit code $LASTEXITCODE"; exit 1 }
          $expected = @(
            '53d53105c5a04042   b6830d69ed500428   7dc73e2260f70271',
            '637427221ce26bfb   80cc02bb71d77ea4   d676ca6dc3f85ac5',
            '8d70199bdbad2a7d   35b64154bef7296a   3df4b3e8b45f9700'
          )
          foreach ($line in $expected) {
            if (-not $output.Contains($line)) { Write-Error "Checksums changed, expected: $line"; exit 1 }
          }
